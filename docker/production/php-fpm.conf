; Replaces the base image's www.conf. The explicit section keeps these settings in the www pool
; even if the base image's docker.conf stops ending with [www].
[www]
user = www-data
group = www-data
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Requests that keep workers busy must be visible in the container log: the access log line gets
; the duration and memory, and a request running longer than 5 s logs a warning with its URI.
; The query string stays out of the log: it can carry personal data.
access.format = "%R - %u %t \"%m %r\" %s %{mili}d ms %{kilo}M kB %C%%"
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
