# Modify some performance-related settings
memory_limit=256M
max_execution_time=60

# Upload settings
upload_max_filesize=64M
post_max_size=64M
file_uploads=On

# The application clock stays UTC; a business time zone is applied only where a date is shown.
date.timezone=UTC

# Setup opcache for better performance
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=10
opcache.use_cwd=1
opcache.save_comments=1
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Errors go to stderr (the container log), never to the response
error_reporting=E_ALL
display_errors=0
log_errors=1
error_log=/dev/stderr
